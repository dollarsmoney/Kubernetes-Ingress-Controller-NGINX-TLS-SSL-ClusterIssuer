{{- if .Values.demo.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tls-ingress.fullname" . }}
  labels:
    {{- include "tls-ingress.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.demo.replicas }}
  selector:
    matchLabels:
      {{- include "tls-ingress.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tls-ingress.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: hello
          image: {{ .Values.demo.image }}
          ports:
            - name: http
              containerPort: {{ .Values.demo.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
{{- end }}
