{{- if .Values.certIssuer.create }}
{{- $issuers := dict "staging" "https://acme-staging-v02.api.letsencrypt.org/directory" "production" "https://acme-v02.api.letsencrypt.org/directory" }}
{{- range $env, $server := $issuers }}
{{- $name := printf "letsencrypt-%s" $env }}
{{- if not (lookup "cert-manager.io/v1" "ClusterIssuer" "" $name) }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
  labels:
    {{- include "tls-ingress.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  acme:
    server: {{ $server }}
    email: {{ required "certIssuer.email is required" $.Values.certIssuer.email }}
    privateKeySecretRef:
      name: {{ $name }}-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ $.Values.certIssuer.ingressClassName }}
{{- end }}
{{- end }}
{{- end }}
