{{- if .Values.demo.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tls-ingress.fullname" . }}
  labels:
    {{- include "tls-ingress.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tls-ingress.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
